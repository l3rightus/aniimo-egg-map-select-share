name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # เพิ่มรูปแมพใหม่ใน public/maps ลงรายการเลือกแมพอัตโนมัติ
      - name: Sync map list
        run: node scripts/sync-maps.js
      # ใส่เลขเวอร์ชันท้ายไฟล์ (?v=...) ให้เบราว์เซอร์โหลดไฟล์ใหม่ทุกครั้งที่ deploy ไม่ปนกับไฟล์เก่าใน cache
      - name: Stamp asset version
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" public/*.html public/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
